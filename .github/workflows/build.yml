---
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fabric ${{ matrix.minecraft }} Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.16.5", "1.20.1"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod
        run: ./gradlew clean build -PmcVersion=${{ matrix.minecraft }} --no-daemon --stacktrace

      - name: Upload mod artifact
        uses: actions/upload-artifact@v7
        with:
          name: sharedbackpack-fabric-${{ matrix.minecraft }}
          path: build/libs/sharedbackpack-fabric-${{ matrix.minecraft }}-*.jar
          if-no-files-found: error
          retention-days: 14
