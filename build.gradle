plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.36'
}

version = '1.5.7'
group = 'com.sharedbackpack'

base { archivesName = 'sharedbackpack' }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('../run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { sharedbackpack { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('../run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { sharedbackpack { source sourceSets.main } }
        }
    }
    sourceSets.main.resources { srcDir 'src/main/resources' }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://jitpack.io' }
}

configurations {
    embed
    implementation.extendsFrom embed
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    embed('org.xerial:sqlite-jdbc:3.45.1.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    embed('com.github.Towdium:PinIn:1.6.0') {
        exclude group: 'it.unimi.dsi'
    }
}

jar {
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // Exclude SLF4J classes to avoid Java module conflict with org.slf4j
    exclude 'META-INF/maven/org.slf4j/**'
    // Exclude Fastutil from PinIn to avoid module conflict
    exclude 'it/unimi/**'
    exclude 'META-INF/maven/it.unimi.dsi/**'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    manifest {
        attributes(
                'Specification-Title': 'sharedbackpack',
                'Specification-Vendor': 'SharedBackpack Dev',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
}

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    def replaceProperties = [
            minecraft_version: '1.20.1',
            minecraft_version_range: '[1.20.1,)',
            forge_version: '47.4.10',
            forge_version_range: '[47.4.10,)',
            loader_version_range: '[1,)',
            mod_id: 'sharedbackpack',
            mod_name: 'Shared Backpack',
            mod_license: 'MIT',
            mod_version: '1.5.7',
            mod_authors: 'SharedBackpack Dev',
            mod_description: 'Team-shared backpack with SQLite storage'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
